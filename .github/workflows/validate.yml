name: Validate workshop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check coverage, documentation links and CI completeness
        run: python scripts/maintain_catalog.py --check
      - name: Validate catalogs and manifests
        shell: pwsh
        run: ./scripts/Test-Catalog.ps1
      - name: Render project catalog
        shell: pwsh
        run: ./scripts/Get-LabCatalog.ps1
      - name: Exercise tooling regressions
        shell: pwsh
        run: ./scripts/Test-Tooling.ps1
      - name: Check every Azure implementation
        shell: pwsh
        run: |
          Get-ChildItem labs -Directory | ForEach-Object {
            ./scripts/Test-LabCompatibility.ps1 -LabManifest "$($_.FullName)/lab.json" -PlatformProfile catalog/platforms/pluralsight/azure.json -Cloud azure -FailOnIncompatible
            if ($LASTEXITCODE) { throw "Compatibility failed for $($_.Name)" }
          }
      - name: Package without credentials
        shell: pwsh
        run: ./scripts/Publish-Lab.ps1 -Lab tiny-notes -PackageOnly

  application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/workshop/requirements*.txt
      - run: python -m pip install -r apps/workshop/requirements.txt -r apps/workshop/requirements-sql.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and exercise the real container image
        if: matrix.python == '3.11'
        shell: bash
        run: |
          docker build -f apps/workshop/Dockerfile.container -t cloud-sandbox-container:ci apps/workshop
          container_id=$(docker run -d --rm -p 127.0.0.1:17071:8080 -e APP_VERSION=v2 cloud-sandbox-container:ci)
          trap 'docker stop "$container_id" >/dev/null' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:17071/api/health; then break; fi
            sleep 1
          done
          python scripts/check_project.py --project container-playground --base-url http://127.0.0.1:17071
          python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:17071/api/container'))['version'] == 'v2'"
          set +e
          docker run --rm -e BROKEN_STARTUP=true cloud-sandbox-container:ci
          failure_code=$?
          set -e
          test "$failure_code" -eq 2

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root:
          - modules/function-workshop
          - modules/network-workshop
          - modules/container-workshop
          - modules/sql-workshop
          - labs/file-pipeline/implementations/azure/terraform
          - labs/network-detective/implementations/azure/terraform
          - labs/container-playground/implementations/azure/terraform
          - labs/sql-inventory/implementations/azure/terraform
          - labs/feature-flags/implementations/azure/terraform
          - labs/observable-serverless-api/implementations/azure/terraform
          - labs/tiny-notes/implementations/azure/terraform
          - labs/queue-worker/implementations/azure/terraform
          - labs/broken-dependency/implementations/azure/terraform
          - labs/search-playground/implementations/azure/terraform
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
