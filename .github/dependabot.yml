version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/workshop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Function package 2.x needs a newer cloud Python runtime; migrate deliberately.
    ignore:
      - dependency-name: azure-functions
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: terraform
    directories:
      - /modules/*
      - /labs/*/implementations/azure/terraform
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
